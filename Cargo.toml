[package]
name = "rs-arrow-words2pgcopy"
version = "0.1.0"
edition = "2024"

exclude = [
]

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"


[[example]]
name = "arrow-array-log2pgcopy"

[profile.release-wasi]
inherits = "release"
lto = true
strip = true
opt-level = 's'
codegen-units = 1

[dependencies.arrow-array]
version = "60.1.0"
default-features = false
features = [
]

[dependencies.arrow-schema]
version = "60.1.0"
default-features = false
features = [
  "serde",
]
